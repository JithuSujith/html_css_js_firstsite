<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>

    <!--BOOTSRAP LINK-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!--GOOGLE FONTS-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">

    <!--CSS LINK-->
    <link rel="stylesheet" href="./index.css">

  </head>
  <body>


<!-- Navbar 2 -->
<div class="container-fluid sticky-top nav2">
    <div class="row justify-content-center align-items-center text-white">

        

        <!-- LOGO -->
        <div class="col-12 col-md-4">
            <img src="./media/rocket-white.png"
                 width="60"
                 alt="Logo"
                 class="logo">
        </div>

        <!-- HOME + SHOP -->
        <div class="col-12 col-md-4 link">
            <ul class="navbar-nav flex-row justify-content-center gap-4">
                <li class="nav-item">
                    <a class="nav-link" href="./index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Shop</a>
                </li>
            </ul>
        </div>

        <!-- SEARCH -->
        <div class="col-12 col-md-4">
            <form class="d-flex">
                <input
                    class="form-control me-2"
                    type="search"
                    placeholder="Search" data-bs-theme="dark">

                <button class="btn btn-outline-success me-2">
                    Search
                </button>
            </form>
        </div>

    </div>
</div>
<header class="container-fluid">
    <section class="row d-flex justify-content-center text-white text-center mt-3 fs-1 fw-1">
        <article class="col-12">
            <h1>Our Shop</h1>
        </article>
    </section>
</header>
<main>
    <section class="container accordions mt-4 ">
    <div class="row">
        <div class="col-12 col-md-3">

            <h3>By Filter:</h3>
         
    <div class="accordion" id="filterAccordion">

    <!-- 1. CATEGORY ACCORDION -->
    <div class="accordion-item">

        <h2 class="accordion-header" id="headingCategory">
            <button
                class="accordion-button"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#collapseCategory"
                aria-expanded="true"
                aria-controls="collapseCategory">
                Categories
            </button>
        </h2>

        <div
            id="collapseCategory"
            class="accordion-collapse collapse show"
            aria-labelledby="headingCategory"
            data-bs-parent="#filterAccordion">

            <div class="accordion-body" id="radious">

                <!-- All Categories -->
                <div class="form-check">
                    <input
                        class="form-check-input"
                        type="radio"
                        name="radios"
                        id="allCategories"
                        value="all"
                        checked>

                    <label
                        class="form-check-label"
                        for="allCategories">
                        All Categories
                    </label>
                </div>

                <!-- Other category radio buttons are added by JavaScript -->

            </div>
        </div>
    </div>


    <!-- 2. PRICE ACCORDION -->
    <div class="accordion-item">

        <h2 class="accordion-header" id="headingPrice">
            <button
                class="accordion-button collapsed"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#collapsePrice"
                aria-expanded="false"
                aria-controls="collapsePrice">
                Price
            </button>
        </h2>

        <div
            id="collapsePrice"
            class="accordion-collapse collapse"
            aria-labelledby="headingPrice"
            data-bs-parent="#filterAccordion">

            <div class="accordion-body">

                <label for="rangeBubble" class="form-label">
                    Maximum price:
                    <span id="priceValue">100</span>
                </label>

                <input
                    type="range"
                    class="form-range"
                    min="0"
                    max="100"
                    value="100"
                    id="rangeBubble">

                <div class="d-flex justify-content-between">
                    <span>0</span>
                    <span id="maxPriceLabel">100</span>
                </div>

            </div>
        </div>
    </div>


    <!-- 3. SEARCH BY PRODUCT NAME ACCORDION -->
    <div class="accordion-item">

        <h2 class="accordion-header" id="headingSearch">
            <button
                class="accordion-button collapsed"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#collapseSearch"
                aria-expanded="false"
                aria-controls="collapseSearch">
                Search by Product Name
            </button>
        </h2>

        <div
            id="collapseSearch"
            class="accordion-collapse collapse"
            aria-labelledby="headingSearch"
            data-bs-parent="#filterAccordion">

            <div class="accordion-body">

                <label for="searchProduct" class="form-label">
                    Product name
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="searchProduct"
                    placeholder="Enter product name...">

            </div>
        </div>
    </div>

    </div>


        </div>
        <div class="col-12 col-md-9 d-flex justify-content-between" id="cardWrapper"></div>
    </div>
    
    </section>        
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="./shop.js"></script>
    
</body>
</html>
